<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>江淮漢韻</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg-0: #f3f8fe;
      --bg-1: #e4eef9;
      --bg-2: #d7e5f4;
      --card: #f8fbffeb;
      --card-strong: #eef4fbd9;
      --line: #b3c6df;
      --ink: #23384f;
      --muted: #667b91;
      --accent: #5f89b7;
      --accent-2: #8fb0d4;
      --input-bg: #ffffff;
      --summary-a: #edf3fa;
      --summary-b: #dde8f4;
      --message-bg: #fbfdff;
      --shadow: #93a8be2b;
      --hover-bg: #dce8f5;
      --hover-line: #8ea8c3;
      --button-top: #7f9fc2;
      --button-bottom: #5d7ea4;
      --button-border: #708fb3;
      --hl-bg: #ffea8a;
      --hl-ink: #2e2400;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-0: #071629;
        --bg-1: #0a1f3f;
        --bg-2: #102c57;
        --card: #0f2748cc;
        --card-strong: #12305acc;
        --line: #315a8b;
        --ink: #e9f1ff;
        --muted: #a8bfdc;
        --accent: #4ca3ff;
        --accent-2: #77c1ff;
        --input-bg: #0b2244;
        --summary-a: #11335f;
        --summary-b: #0f2b4e;
        --message-bg: #0d2342;
        --shadow: #020a1555;
        --hover-bg: #245287;
        --hover-line: #6ea7e2;
        --button-top: #4ca3ff;
        --button-bottom: #2d7fd8;
        --button-border: #3f8edf;
        --hl-bg: #ffd770;
        --hl-ink: #1d1300;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      font-family: "Noto Serif SC", "Source Han Serif SC", serif;
      background:
        radial-gradient(760px 280px at 12% -8%, color-mix(in srgb, var(--accent) 12%, transparent) 0%, transparent 68%),
        radial-gradient(900px 360px at 112% 18%, color-mix(in srgb, var(--accent-2) 18%, transparent) 0%, transparent 62%),
        linear-gradient(145deg, var(--bg-0) 0%, var(--bg-1) 45%, var(--bg-2) 100%);
      min-height: 100vh;
    }

    .wrap {
      width: min(980px, 92vw);
      margin: 24px auto 44px;
    }

    header {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px 18px;
      box-shadow: 0 5px 16px var(--shadow);
      position: sticky;
      top: 10px;
      z-index: 10;
      backdrop-filter: blur(2px);
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(20px, 3.2vw, 30px);
      letter-spacing: 0.01em;
      color: var(--ink);
    }

    .search-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
    }

    input[type="search"] {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 10px 12px;
      font-size: 16px;
      color: var(--ink);
      background: var(--input-bg);
      outline: none;
    }

    input[type="search"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px #4ca3ff30;
    }

    input[type="search"]::placeholder {
      color: var(--muted);
    }

    button {
      border: 1px solid var(--button-border);
      background: linear-gradient(180deg, var(--button-top), var(--button-bottom));
      color: #f7fbff;
      border-radius: 4px;
      padding: 0 16px;
      font-size: 15px;
      cursor: pointer;
      box-shadow: inset 0 1px 0 #ffffff22;
    }

    .meta {
      margin-top: 10px;
      color: var(--muted);
      font-size: 14px;
    }

    .list {
      margin-top: 18px;
      display: grid;
      gap: 12px;
    }

    details.post {
      background: var(--card-strong);
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 4px 12px var(--shadow);
    }

    summary {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: baseline;
      padding: 12px 14px;
      cursor: pointer;
      background: linear-gradient(180deg, var(--summary-a), var(--summary-b));
      border-bottom: 1px solid color-mix(in srgb, var(--line) 70%, transparent);
    }

    summary::-webkit-details-marker { display: none; }

    .author {
      font-weight: 700;
      color: var(--ink);
    }

    .date {
      color: var(--muted);
      font-size: 13px;
    }

    .tid {
      margin-left: auto;
      font-size: 12px;
      color: var(--ink);
      background: color-mix(in srgb, var(--accent-2) 28%, var(--card));
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid color-mix(in srgb, var(--accent) 48%, var(--line));
      text-decoration: none;
    }

    a.tid:hover {
      background: var(--hover-bg);
      border-color: var(--hover-line);
    }

    .message {
      margin: 0;
      line-height: 1.75;
      padding: 14px;
      border-top: 1px dashed var(--line);
      background: var(--message-bg);
      color: var(--ink);
    }

    .message mark.hl {
      background: var(--hl-bg);
      color: var(--hl-ink);
      border-radius: 2px;
      padding: 0 0.08em;
    }

    .message blockquote {
      margin: 8px 0;
      padding: 8px 10px;
      border-left: 3px solid var(--line);
      background: color-mix(in srgb, var(--card) 70%, transparent);
    }

    .message a {
      color: var(--accent);
      text-decoration: underline;
      word-break: break-all;
    }

    .message img {
      max-width: min(100%, 680px);
      height: auto;
      border: 1px solid var(--line);
      border-radius: 4px;
      display: block;
      margin: 6px 0;
    }

    .bb-attach {
      margin: 8px 0;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: color-mix(in srgb, var(--card) 70%, transparent);
    }

    .bb-attach-title {
      font-weight: 600;
      margin-bottom: 4px;
    }

    .bb-attach-meta {
      color: var(--muted);
      font-size: 12px;
    }

    .bb-attach-missing {
      color: var(--muted);
      font-size: 12px;
    }

    .bb-flash {
      margin: 8px 0;
      padding: 8px 10px;
      border: 1px dashed var(--line);
      border-radius: 4px;
      background: color-mix(in srgb, var(--card) 65%, transparent);
    }

    .bb-list {
      margin: 8px 0 8px 18px;
      padding: 0;
    }

    .bb-table {
      width: 100%;
      border-collapse: collapse;
      margin: 8px 0;
      font-size: 14px;
    }

    .bb-table td,
    .bb-table th {
      border: 1px solid var(--line);
      padding: 6px 8px;
      vertical-align: top;
    }

    .bb-table th {
      background: color-mix(in srgb, var(--card-strong) 88%, transparent);
      font-weight: 700;
    }

    .empty {
      margin-top: 24px;
      text-align: center;
      color: var(--muted);
      font-size: 15px;
    }

    [hidden] { display: none !important; }

    @media (max-width: 640px) {
      .search-row { grid-template-columns: 1fr; }
      button { padding: 10px 14px; }
      .tid { margin-left: 0; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1 id="pageTitle">帖子浏览</h1>
      <div id="searchWrap" class="search-row">
        <input id="searchInput" type="search" placeholder="搜索全部文章：tid / 标题 / 内容" />
        <button id="clearBtn" type="button">清空</button>
      </div>
      <div id="meta" class="meta"></div>
    </header>

    <main id="list" class="list"></main>
    <p id="empty" class="empty" hidden>没有匹配结果。</p>
  </div>

  <script id="postsData" type="application/json">__EMBEDDED_POSTS_JSON__</script>
  <script id="attachmentsData" type="application/json">__EMBEDDED_ATTACHMENTS_JSON__</script>
  <script>
    const searchWrap = document.getElementById('searchWrap');
    const searchInput = document.getElementById('searchInput');
    const clearBtn = document.getElementById('clearBtn');
    const meta = document.getElementById('meta');
    const list = document.getElementById('list');
    const empty = document.getElementById('empty');
    const pageTitle = document.getElementById('pageTitle');
    const PAGE_SIZE = 80;
    const SEARCH_DEBOUNCE_MS = 220;

    const params = new URLSearchParams(window.location.search);
    const tidParam = Number(params.get('tid'));
    const hasTidFilter = Number.isFinite(tidParam) && tidParam > 0;

    const allPosts = JSON.parse(document.getElementById('postsData').textContent || '[]');
    const allAttachments = JSON.parse(document.getElementById('attachmentsData').textContent || '[]');
    const normalizedPosts = allPosts.map((p) => ({
      ...p,
      _searchText: `${p.tid} ${p.subject || ''} ${p.message || ''}`.toLowerCase()
    }));
    const attachmentByAid = new Map(allAttachments.map((a) => [Number(a.aid), a]));

    let activeRows = [];
    let activeKeyword = '';
    let renderedCount = 0;
    let observer = null;

    function escapeHtml(s) {
      return s
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function formatDate(ts) {
      const d = new Date(ts * 1000);
      if (Number.isNaN(d.getTime())) return String(ts);
      return d.toLocaleDateString('zh-CN');
    }

    function getTidSubject(tidRows) {
      const row = tidRows.find((p) => (p.subject || '').trim().length > 0);
      return row ? row.subject.trim() : '';
    }

    function normalizeColor(raw) {
      const value = String(raw || '').trim();
      if (/^#[0-9a-f]{3}([0-9a-f]{3})?$/i.test(value)) {
        return value;
      }
      if (/^[a-z]{3,20}$/i.test(value)) {
        return value;
      }
      return '';
    }

    function normalizeSize(raw) {
      const value = String(raw || '').trim().toLowerCase();
      const sizeMap = {
        '1': '11px',
        '2': '12px',
        '3': '14px',
        '4': '16px',
        '5': '18px',
        '6': '22px',
        '7': '28px'
      };

      if (sizeMap[value]) {
        return sizeMap[value];
      }

      if (/^[0-9]{1,2}px$/.test(value)) {
        const n = Number(value.slice(0, -2));
        return `${Math.max(10, Math.min(48, n))}px`;
      }

      if (/^[0-9]{1,2}$/.test(value)) {
        const n = Number(value);
        return `${Math.max(10, Math.min(48, n))}px`;
      }

      return '';
    }

    function sanitizeUrl(raw) {
      const value = String(raw || '').trim().replaceAll('&amp;', '&');
      if (/^(https?:\/\/|ftp:\/\/|mailto:)/i.test(value)) {
        return value;
      }
      return '';
    }

    function sanitizeFontFamily(raw) {
      const value = String(raw || '').trim();
      if (!value) {
        return '';
      }
      if (/^[a-zA-Z0-9\s\-_,"']{1,80}$/.test(value)) {
        return value;
      }
      return '';
    }

    function formatFileSize(bytes) {
      const n = Number(bytes);
      if (!Number.isFinite(n) || n <= 0) return '-';
      if (n < 1024) return `${n} B`;
      if (n < 1024 * 1024) return `${(n / 1024).toFixed(1)} KB`;
      return `${(n / (1024 * 1024)).toFixed(2)} MB`;
    }

    function attachmentHref(att) {
      const path = String(att.attachment || '').replaceAll('\\\\', '/').replace(/^\/+/, '');
      if (!path) return '';
      return `attachments/${encodeURI(path)}`;
    }

    function renderAttachmentByAid(aid, forceImage = false) {
      const id = Number(aid);
      const att = attachmentByAid.get(id);
      if (!att) {
        return `<span class="bb-attach-missing">[附件 ${escapeHtml(String(aid))} 不存在]</span>`;
      }

      const href = attachmentHref(att);
      const filename = escapeHtml(att.filename || `附件 ${id}`);
      const filetype = escapeHtml(att.filetype || 'unknown');
      const filesize = escapeHtml(formatFileSize(att.filesize));
      const downloads = escapeHtml(String(att.downloads || 0));
      const isImage = forceImage || Number(att.isimage) === 1 || String(att.filetype || '').toLowerCase().startsWith('image/');

      if (!href) {
        return `<span class="bb-attach-missing">[附件 ${escapeHtml(String(aid))} 路径无效]</span>`;
      }

      if (isImage) {
        return `<div class="bb-attach"><a href="${href}" target="_blank" rel="noopener noreferrer"><img src="${href}" alt="${filename}" loading="lazy"></a><div class="bb-attach-meta">${filetype} / ${filesize} / 下载 ${downloads}</div></div>`;
      }

      return `<div class="bb-attach"><div class="bb-attach-title"><a href="${href}" target="_blank" rel="noopener noreferrer">${filename}</a></div><div class="bb-attach-meta">${filetype} / ${filesize} / 下载 ${downloads}</div></div>`;
    }

    function renderMessage(raw) {
      let text = escapeHtml(String(raw || '')).replace(/\r\n?/g, '\n');

      const replaceNested = (regex, replacer) => {
        let prev = '';
        let guard = 0;
        while (text !== prev && guard < 20) {
          prev = text;
          text = text.replace(regex, replacer);
          guard += 1;
        }
      };

      replaceNested(/\[b\]([\s\S]*?)\[\/b\]/gi, '<strong>$1</strong>');
      replaceNested(/\[i\]([\s\S]*?)\[\/i\]/gi, '<em>$1</em>');
      replaceNested(/\[u\]([\s\S]*?)\[\/u\]/gi, '<u>$1</u>');
      replaceNested(/\[quote(?:=[^\]]+)?\]([\s\S]*?)\[\/quote\]/gi, '<blockquote>$1</blockquote>');

      replaceNested(/\[color=([^\]]+)\]([\s\S]*?)\[\/color\]/gi, (_, color, content) => {
        const safeColor = normalizeColor(color);
        if (!safeColor) {
          return content;
        }
        return `<span style="color:${safeColor}">${content}</span>`;
      });

      replaceNested(/\[size=([^\]]+)\]([\s\S]*?)\[\/size\]/gi, (_, size, content) => {
        const safeSize = normalizeSize(size);
        if (!safeSize) {
          return content;
        }
        return `<span style="font-size:${safeSize}">${content}</span>`;
      });

      replaceNested(/\[font=([^\]]+)\]([\s\S]*?)\[\/font\]/gi, (_, font, content) => {
        const safeFont = sanitizeFontFamily(font);
        if (!safeFont) {
          return content;
        }
        return `<span style="font-family:${escapeHtml(safeFont)}">${content}</span>`;
      });

      replaceNested(/\[url=([^\]]+)\]([\s\S]*?)\[\/url\]/gi, (_, url, content) => {
        const safeUrl = sanitizeUrl(url);
        if (!safeUrl) {
          return content;
        }
        return `<a href="${escapeHtml(safeUrl)}" target="_blank" rel="noopener noreferrer">${content}</a>`;
      });

      replaceNested(/\[url\]([\s\S]*?)\[\/url\]/gi, (_, url) => {
        const safeUrl = sanitizeUrl(url);
        if (!safeUrl) {
          return url;
        }
        const label = escapeHtml(safeUrl);
        return `<a href="${label}" target="_blank" rel="noopener noreferrer">${label}</a>`;
      });

      replaceNested(/\[img\]([\s\S]*?)\[\/img\]/gi, (_, url) => {
        const safeUrl = sanitizeUrl(url);
        if (!safeUrl) {
          return '';
        }
        return `<img src="${escapeHtml(safeUrl)}" alt="image" loading="lazy" />`;
      });

      replaceNested(/\[flash(?:=([^\]]+))?\]([\s\S]*?)\[\/flash\]/gi, (_, size, url) => {
        const safeUrl = sanitizeUrl(url);
        if (!safeUrl) {
          return '';
        }
        const widthHeight = String(size || '').split(',').map((x) => Number(x.trim()));
        const w = Number.isFinite(widthHeight[0]) ? Math.max(180, Math.min(960, widthHeight[0])) : 560;
        const h = Number.isFinite(widthHeight[1]) ? Math.max(120, Math.min(720, widthHeight[1])) : 420;
        const escapedUrl = escapeHtml(safeUrl);
        return `<div class="bb-flash"><embed src="${escapedUrl}" width="${w}" height="${h}" type="application/x-shockwave-flash"></embed><div class="bb-attach-meta"><a href="${escapedUrl}" target="_blank" rel="noopener noreferrer">打开 Flash 链接</a></div></div>`;
      });

      replaceNested(/\[list(?:=[^\]]+)?\]([\s\S]*?)\[\/list\]/gi, (_, body) => {
        const items = String(body)
          .split(/\[\*\]/)
          .map((x) => x.trim())
          .filter(Boolean);
        if (items.length === 0) {
          return '';
        }
        const htmlItems = items.map((x) => `<li>${x}</li>`).join('');
        return `<ul class="bb-list">${htmlItems}</ul>`;
      });

      text = text
        .replace(/\[table(?:=[^\]]*)?\]/gi, '<table class="bb-table"><tbody>')
        .replace(/\[\/table\]/gi, '</tbody></table>')
        .replace(/\[tr(?:=[^\]]*)?\]/gi, '<tr>')
        .replace(/\[\/tr\]/gi, '</tr>')
        .replace(/\[td(?:=[^\]]*)?\]/gi, '<td>')
        .replace(/\[\/td\]/gi, '</td>')
        .replace(/\[th(?:=[^\]]*)?\]/gi, '<th>')
        .replace(/\[\/th\]/gi, '</th>');

      replaceNested(/\[attach\](\d+)\[\/attach\]/gi, (_, aid) => renderAttachmentByAid(aid, false));
      replaceNested(/\[attachimg\](\d+)\[\/attachimg\]/gi, (_, aid) => renderAttachmentByAid(aid, true));

      text = text.replace(/\n/g, '<br>');
      return text;
    }

    function escapeRegExp(s) {
      return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function highlightMessageHtml(html, keyword) {
      const q = String(keyword || '').trim();
      if (!q) {
        return html;
      }

      const pattern = new RegExp(escapeRegExp(q), 'gi');
      const template = document.createElement('template');
      template.innerHTML = html;
      const walker = document.createTreeWalker(template.content, NodeFilter.SHOW_TEXT);
      const textNodes = [];

      while (walker.nextNode()) {
        textNodes.push(walker.currentNode);
      }

      for (const node of textNodes) {
        const source = node.nodeValue || '';
        if (!source) {
          continue;
        }

        pattern.lastIndex = 0;
        if (!pattern.test(source)) {
          continue;
        }

        pattern.lastIndex = 0;
        const frag = document.createDocumentFragment();
        let lastIndex = 0;
        let match = null;

        while ((match = pattern.exec(source)) !== null) {
          const idx = match.index;
          const value = match[0];
          if (idx > lastIndex) {
            frag.appendChild(document.createTextNode(source.slice(lastIndex, idx)));
          }

          const mark = document.createElement('mark');
          mark.className = 'hl';
          mark.textContent = value;
          frag.appendChild(mark);
          lastIndex = idx + value.length;

          if (value.length === 0) {
            pattern.lastIndex += 1;
          }
        }

        if (lastIndex < source.length) {
          frag.appendChild(document.createTextNode(source.slice(lastIndex)));
        }

        if (node.parentNode) {
          node.parentNode.replaceChild(frag, node);
        }
      }

      return template.innerHTML;
    }

    function cleanupObserver() {
      if (observer) {
        observer.disconnect();
        observer = null;
      }
    }

    function appendNextBatch() {
      if (renderedCount >= activeRows.length) {
        cleanupObserver();
        return;
      }

      const nextRows = activeRows.slice(renderedCount, renderedCount + PAGE_SIZE);
      const startFloor = renderedCount;
      const html = nextRows.map((p, idx) => {
        const floor = startFloor + idx + 1;
        const openAttr = hasTidFilter ? ' open' : '';
        const rawMessageHtml = renderMessage(p.message || '');
        const messageHtml = highlightMessageHtml(rawMessageHtml, activeKeyword);
        const badge = hasTidFilter
          ? `<span class="tid">#${floor}</span>`
          : `<a class="tid" href="?tid=${encodeURIComponent(p.tid)}" target="_blank" rel="noopener noreferrer">tid=${escapeHtml(String(p.tid))}</a>`;
        return `
        <details class="post"${openAttr}>
          <summary>
            <span class="author">${escapeHtml(p.author || '匿名')}</span>
            <span class="date">${escapeHtml(formatDate(p.dateline))}</span>
            ${badge}
          </summary>
          <div class="message">${messageHtml}</div>
        </details>
      `;
      }).join('');

      list.insertAdjacentHTML('beforeend', html);
      renderedCount += nextRows.length;
    }

    function setupLazyLoad() {
      cleanupObserver();

      if (renderedCount >= activeRows.length) {
        return;
      }

      const sentinel = document.createElement('div');
      sentinel.id = 'lazySentinel';
      sentinel.style.height = '1px';
      list.appendChild(sentinel);

      observer = new IntersectionObserver((entries) => {
        if (!entries[0].isIntersecting) {
          return;
        }

        sentinel.remove();
        appendNextBatch();

        if (renderedCount < activeRows.length) {
          list.appendChild(sentinel);
        } else {
          cleanupObserver();
        }
      }, { root: null, rootMargin: '500px 0px', threshold: 0 });

      observer.observe(sentinel);
    }

    function render() {
      const keywordText = searchInput.value.trim();
      const keyword = keywordText.toLowerCase();
      const baseRows = hasTidFilter ? normalizedPosts.filter((p) => p.tid === tidParam) : normalizedPosts;
      let rows = baseRows;

      activeKeyword = hasTidFilter ? '' : keywordText;

      if (!hasTidFilter && keyword) {
        rows = baseRows.filter((p) => p._searchText.includes(keyword));
      }

      rows = [...rows].sort((a, b) => a.dateline - b.dateline);
      activeRows = rows;
      renderedCount = 0;

      if (hasTidFilter) {
        const subject = getTidSubject(baseRows);
        const title = subject || `tid=${tidParam}`;
        pageTitle.textContent = title;
        document.title = title;
        meta.textContent = `当前 tid=${tidParam}，共 ${rows.length} 条帖子（按日期升序）`;
      } else if (keyword) {
        pageTitle.textContent = '帖子浏览';
        document.title = '江淮论坛帖子浏览';
        meta.textContent = `全局搜索：${rows.length} 条结果`;
      } else {
        pageTitle.textContent = '帖子浏览';
        document.title = '江淮论坛帖子浏览';
        meta.textContent = `显示全部 ${rows.length} 条帖子（按日期升序）`;
      }

      if (rows.length === 0) {
        cleanupObserver();
        list.innerHTML = '';
        empty.hidden = false;
        return;
      }

      empty.hidden = true;
      list.innerHTML = '';
      appendNextBatch();
      setupLazyLoad();
    }

    if (hasTidFilter) {
      searchWrap.hidden = true;
    }

    let debounceTimer = null;
    searchInput.addEventListener('input', () => {
      if (debounceTimer) {
        clearTimeout(debounceTimer);
      }
      debounceTimer = setTimeout(render, SEARCH_DEBOUNCE_MS);
    });
    clearBtn.addEventListener('click', () => {
      searchInput.value = '';
      render();
      searchInput.focus();
    });

    render();
  </script>
</body>
</html>
